name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.3
    
    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version: '1.26.4'

    - name: Test
      run: go test ./...
    
    - name: Build binaries
      run: |
        mkdir -p dist
        
        # Linux AMD64
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/servexy-linux-amd64 .
        
        # Linux ARM64
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/servexy-linux-arm64 .
        
        # macOS AMD64
        CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/servexy-darwin-amd64 .
        
        # macOS ARM64
        CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/servexy-darwin-arm64 .
        
        # Windows AMD64
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/servexy-windows-amd64.exe .
        
        # Windows ARM64
        CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/servexy-windows-arm64.exe .
    
    - name: Create Release
      uses: softprops/action-gh-release@v3.0.0
      with:
        files: dist/*
        generate_release_notes: true
        draft: false
        prerelease: false
