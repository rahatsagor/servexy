<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">servexy serving a single-page app</title>
  <desc id="desc">A terminal runs servexy ./dist --spa --network. servexy reports the folder it is serving, that SPA fallback and gzip compression are enabled, and prints a local URL and a network URL.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 17px; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .text { fill: #e4ead9; }
    .dim { fill: #8c9a7d; }
    .lime { fill: #d6f77a; }
    .typing { animation: type 1.5s steps(30) 0.5s both; }
    .typing-cursor { animation: show-off 0s 2.1s both; }
    .line { animation: show-on 0.25s ease-out both; }
    .l1 { animation-delay: 2.3s; }
    .l2 { animation-delay: 2.45s; }
    .l3 { animation-delay: 2.6s; }
    .l4 { animation-delay: 2.75s; }
    .l5 { animation-delay: 2.9s; }
    .l6 { animation-delay: 3.05s; }
    .l7 { animation-delay: 3.2s; }
    .blink { animation: blink 1.1s steps(1) 3.4s infinite; }
    @keyframes type { from { transform: translateX(0); } to { transform: translateX(306px); } }
    @keyframes show-on { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes show-off { to { opacity: 0; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .typing, .typing-cursor, .line, .blink { animation: none; }
      .typing { transform: translateX(306px); }
      .typing-cursor { opacity: 0; }
    }
  </style>

  <rect x="0.5" y="0.5" width="899" height="399" rx="16" fill="#10120f" stroke="#2c3424"/>
  <path d="M1 48H899" stroke="#232a1c"/>
  <circle cx="28" cy="24" r="6" fill="#3a4430"/>
  <circle cx="48" cy="24" r="6" fill="#3a4430"/>
  <circle cx="68" cy="24" r="6" fill="#3a4430"/>
  <text x="450" y="29" text-anchor="middle" class="mono dim" font-size="13">~/projects/storefront</text>
  <g transform="translate(838 14)">
    <rect width="40" height="20" rx="10" fill="#d6f77a"/>
    <g transform="translate(9 0) scale(0.5)"><path d="M39 6H15L4 17L26 27H5V38H29L40 27L18 17H39V6Z" fill="#10120f"/></g>
  </g>

  <text x="40" y="100" class="mono lime">$</text>
  <text x="64" y="100" class="mono text" textLength="306" lengthAdjust="spacingAndGlyphs">servexy ./dist --spa --network</text>
  <g class="typing">
    <rect x="64" y="80" width="330" height="28" fill="#10120f"/>
    <rect class="typing-cursor" x="64" y="83" width="10" height="21" fill="#d6f77a"/>
  </g>

  <g class="mono" xml:space="preserve">
    <text x="40" y="150" class="line l1"><tspan class="text">serving </tspan><tspan class="dim">/Users/you/projects/storefront/dist</tspan></text>
    <text x="40" y="180" class="line l2 text">SPA fallback enabled</text>
    <text x="40" y="210" class="line l3 text">gzip compression enabled</text>
    <text x="40" y="250" class="line l4"><tspan class="dim">local:   </tspan><tspan class="lime">http://localhost:8080</tspan></text>
    <text x="40" y="280" class="line l5"><tspan class="dim">network: </tspan><tspan class="lime">http://192.168.1.42:8080</tspan></text>
    <text x="40" y="320" class="line l6 dim">press Ctrl+C to stop</text>
  </g>
  <g class="line l7"><rect class="blink" x="40" y="338" width="10" height="21" fill="#d6f77a"/></g>
</svg>
