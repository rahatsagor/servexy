<svg xmlns="http://www.w3.org/2000/svg" width="900" height="456" viewBox="0 0 900 456" role="img" aria-labelledby="title desc">
  <title id="title">How servexy --spa answers requests</title>
  <desc id="desc">Page navigations to /dashboard/settings and /users/jane.doe get index.html with 200. An existing asset is served as the file. A missing script, a browser fetch to /api/users, and the hidden file /.env all get 404.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .text { fill: #e4ead9; }
    .dim { fill: #8c9a7d; }
    .lime { fill: #d6f77a; }
    .miss { fill: #ffab85; }
  </style>

  <rect x="0.5" y="0.5" width="899" height="455" rx="16" fill="#10120f" stroke="#2c3424"/>
  <text x="40" y="52" class="mono lime" font-size="14" letter-spacing="1">$ servexy ./dist --spa</text>
  <text x="40" y="88" class="sans text" font-size="26" font-weight="600">Routes load the app. Mistakes stay 404.</text>

  <g class="sans dim" font-size="12" letter-spacing="1.2">
    <text x="40" y="132">REQUEST</text>
    <text x="370" y="132">WHAT IT IS</text>
    <text x="620" y="132">RESPONSE</text>
  </g>
  <path d="M40 146H860" stroke="#2c3424"/>

  <g font-size="16">
    <text x="40" y="181" class="mono text">GET /dashboard/settings</text>
    <text x="370" y="181" class="sans dim" font-size="15">Page navigation</text>
    <rect x="620" y="163" width="48" height="24" rx="6" fill="#d6f77a"/>
    <text x="644" y="180" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#10120f">200</text>
    <text x="682" y="181" class="mono lime" font-size="15">index.html</text>
    <path d="M40 202H860" stroke="#1d2318"/>

    <text x="40" y="229" class="mono text">GET /users/jane.doe</text>
    <text x="370" y="229" class="sans dim" font-size="15">Navigation with a dot</text>
    <rect x="620" y="211" width="48" height="24" rx="6" fill="#d6f77a"/>
    <text x="644" y="228" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#10120f">200</text>
    <text x="682" y="229" class="mono lime" font-size="15">index.html</text>
    <path d="M40 250H860" stroke="#1d2318"/>

    <text x="40" y="277" class="mono text">GET /assets/app-3f9a1c.js</text>
    <text x="370" y="277" class="sans dim" font-size="15">File that exists</text>
    <rect x="620" y="259" width="48" height="24" rx="6" fill="#d6f77a"/>
    <text x="644" y="276" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#10120f">200</text>
    <text x="682" y="277" class="mono text" font-size="15">the file, gzipped</text>
    <path d="M40 298H860" stroke="#1d2318"/>

    <text x="40" y="325" class="mono text">GET /assets/missing.js</text>
    <text x="370" y="325" class="sans dim" font-size="15">Missing script</text>
    <rect x="620" y="307" width="48" height="24" rx="6" fill="#3b2419"/>
    <text x="644" y="324" text-anchor="middle" class="mono miss" font-size="13" font-weight="700">404</text>
    <text x="682" y="325" class="mono miss" font-size="15">Not Found</text>
    <path d="M40 346H860" stroke="#1d2318"/>

    <text x="40" y="373" class="mono text">fetch("/api/users")</text>
    <text x="370" y="373" class="sans dim" font-size="15">Browser fetch() call</text>
    <rect x="620" y="355" width="48" height="24" rx="6" fill="#3b2419"/>
    <text x="644" y="372" text-anchor="middle" class="mono miss" font-size="13" font-weight="700">404</text>
    <text x="682" y="373" class="mono miss" font-size="15">Not Found</text>
    <path d="M40 394H860" stroke="#1d2318"/>

    <text x="40" y="421" class="mono text">GET /.env</text>
    <text x="370" y="421" class="sans dim" font-size="15">Hidden file</text>
    <rect x="620" y="403" width="48" height="24" rx="6" fill="#3b2419"/>
    <text x="644" y="420" text-anchor="middle" class="mono miss" font-size="13" font-weight="700">404</text>
    <text x="682" y="421" class="mono miss" font-size="15">Not Found</text>
  </g>
</svg>
